<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Magi</title>
  <!-- Release number: keep equal to version.json and the ?v= on every CSS/JS link. -->
  <meta name="magi-version" content="79">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Magi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap">
  <!-- Glyph typefaces for Binary and X's and O's; the canvas waits for each before drawing it. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&family=Literata:wght@500&family=Silkscreen&family=VT323&display=swap">
  <link rel="stylesheet" href="css/magi.css?v=79">
</head>
<body>
  <div class="app" id="app" data-phase="live" data-mode="photo">
    <main class="stage" id="stage">
      <canvas class="view" id="view" aria-label="Effect preview"></canvas>
      <canvas class="hud" id="hud" aria-hidden="true"></canvas>
      <video class="review-video" id="review-video" playsinline loop muted hidden></video>
      <div class="hint" id="hint" role="status" hidden></div>
      <div class="notice" id="notice" hidden>
        <div class="notice-body">
          <p id="notice-text"></p>
          <div class="notice-actions" id="notice-actions"></div>
        </div>
      </div>
    </main>


    <button class="save" id="save" type="button" aria-label="Save to device" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="save-arrow"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/></g>
        <path class="save-base" d="M5 20h14"/>
      </svg>
    </button>

    <div class="timer" id="timer" role="timer" aria-live="off" hidden>00:00</div>

    <section class="tray" id="tray" data-open="false" aria-label="Effects">
      <input class="tray-search" id="search" type="search" placeholder="Search effects" aria-label="Search effects" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="tiles" id="tiles" role="radiogroup" aria-label="Effect"></div>
      <div class="controls" id="controls"></div>
    </section>

    <nav class="toolbar" aria-label="Camera controls">
      <div class="tb-left">
        <div class="modes" role="radiogroup" aria-label="Capture mode">
          <button type="button" role="radio" data-mode-option="photo" aria-label="Photo" aria-checked="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12"/><path d="M9 7l1.5-2.5h3L15 7"/><circle cx="12" cy="13" r="3.25"/></svg>
          </button>
          <button type="button" role="radio" data-mode-option="video" aria-label="Video" aria-checked="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="12.5" height="10"/><path d="M15.5 10.5l5.5-3v9l-5.5-3"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="upload" type="button" aria-label="Upload photo or video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M7 8.5l5-5 5 5"/><path d="M4.5 14v6h15v-6"/></svg>
        </button>
        <button class="icon-btn" id="camera" type="button" aria-label="Return to live camera" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>
        </button>
      </div>

      <button class="shutter" id="shutter" type="button" aria-label="Take photo">
        <span class="shutter-core"></span>
        <svg class="shutter-retake" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12a6.5 6.5 0 1 0 2-4.7"/><path d="M5 4v4h4"/></svg>
      </button>

      <div class="tb-right">
        <button class="icon-btn" id="mic" type="button" aria-label="Record sound" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg>
        </button>
        <button class="icon-btn" id="cams" type="button" aria-label="Choose camera" aria-haspopup="menu" aria-expanded="false" aria-controls="cam-menu" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12"/><path d="M9 7l1.5-2.5h3L15 7"/><path d="M9 13h6"/><path d="M13 11l2 2-2 2"/></svg>
        </button>
        <div class="cam-menu" id="cam-menu" role="menu" aria-label="Cameras" hidden></div>
        <button class="icon-btn caret" id="caret" type="button" aria-label="Show effects" aria-expanded="false" aria-controls="tray">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        </button>
      </div>
    </nav>

    <input type="file" id="file" accept="image/*,video/*" hidden>
  </div>

  <script src="js/effects/config.js?v=79"></script>
  <script src="js/effects/shared.js?v=79"></script>
  <script src="js/effects/gpu-particles.js?v=79"></script>
  <script src="js/effects/bitmap.js?v=79"></script>
  <script src="js/effects/ascii.js?v=79"></script>
  <script src="js/effects/binary.js?v=79"></script>
  <script src="js/effects/xs-and-os.js?v=79"></script>
  <script src="js/effects/quadtree.js?v=79"></script>
  <script src="js/tracking.js?v=79"></script>
  <script src="js/interaction.js?v=79"></script>
  <script src="js/library.js?v=79"></script>
  <script src="js/media.js?v=79"></script>
  <script src="js/effects/landmarks.js?v=79"></script>
  <script src="js/effects/landmark-modes.js?v=79"></script>
  <script src="js/effects/font-editor.js?v=79"></script>
  <script src="js/effects/line-art.js?v=79"></script>
  <script src="js/effects/particles.js?v=79"></script>
  <script src="js/effects/particle-life.js?v=79"></script>
  <script src="js/effects/exhale.js?v=79"></script>
  <script src="js/effects/word-box.js?v=79"></script>
  <script src="js/effects/word-space.js?v=79"></script>
  <script src="js/effects/mosh.js?v=79"></script>
  <script src="js/effects/pinch-frame.js?v=79"></script>
  <script src="js/effects/wisp.js?v=79"></script>
  <script src="js/effects/bubbles.js?v=79"></script>
  <script src="js/effects/web.js?v=79"></script>
  <script src="js/effects/claw.js?v=79"></script>
  <script src="js/effects/fluid-cube.js?v=79"></script>
  <script src="js/effects/accordion.js?v=79"></script>
  <script src="js/effects/tutting.js?v=79"></script>
  <script src="js/effects/color-names.js?v=79"></script>
  <script src="js/effects/chromatic.js?v=79"></script>
  <script src="js/effects/tendrils.js?v=79"></script>
  <script src="js/effects/cards.js?v=79"></script>
  <script src="js/effects/siri.js?v=79"></script>
  <script src="js/effects/swarm.js?v=79"></script>
  <script src="js/effects/aurora.js?v=79"></script>
  <script src="js/effects/fibre.js?v=79"></script>
  <script src="js/effects/plexus.js?v=79"></script>
  <script src="js/effects/polar.js?v=79"></script>
  <script src="js/effects/scanner.js?v=79"></script>
  <script src="js/effects/media-fx.js?v=79"></script>
  <script src="js/effects/datamosh.js?v=79"></script>
  <script src="js/effects/token-cry.js?v=79"></script>
  <script src="js/effects/collage.js?v=79"></script>
  <script src="js/effects/glitch.js?v=79"></script>
  <script src="js/effects/facades.js?v=79"></script>
  <script src="js/app.js?v=79"></script>
</body>
</html>
